<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Baloo+Bhaijaan+2:wght@400;600;700&family=Cairo:wght@400;600;700&family=Fredoka:wght@400;500;600;700&family=Gaegu:wght@400;700&family=Mali:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: purple sidebar + pastel card dashboard, drawer sidebar on phones */
:root{--bg:#f7f2ff;--surface:#fff;--fg:#2d1f4e;--muted:#6d5f8f;--line:#e2d9f5;--accent:#7c3fbf;--accent-fg:#fff;--pink:#e0568f;--side1:#6a42a3;--side2:#4e2f80;--side-fg:#f3ecff;--c0:#ffd9e6;--c1:#fff0c4;--c2:#c9f0e6;--c3:#e4d8fc;--ok:#1f8a4d;--okbg:#dff5e8;--warn:#a06400;--warnbg:#fdf0d4;--bad:#bd2b3f;--badbg:#fde3e6;--shadow:0 3px 10px rgba(80,50,140,.12);--bgimg:linear-gradient(135deg,#faf6ff 0%,#eef2ff 45%,#fdf0fa 100%);color-scheme:light;--font:'Fredoka','Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);background-image:var(--bgimg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:600}
h2{font-size:1.15rem}h3{font-size:1rem}
.app{display:flex;gap:16px;max-width:1320px;margin-inline:auto;align-items:flex-start}
.side{width:218px;flex:none;background:linear-gradient(170deg,var(--side1),var(--side2));color:var(--side-fg);border-radius:20px;padding:14px 10px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
.brand{background:#fff;border-radius:14px;padding:6px;margin-bottom:12px;text-align:center}
.brand{padding:10px}.brand img{display:block;margin:auto;width:100%;max-width:190px;height:auto}
.side button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:inherit;font:inherit;padding:9px 12px;border-radius:12px;cursor:pointer;text-align:start}
.side button.on{background:linear-gradient(90deg,#f58ab5,#d667c9);color:#fff;font-weight:600}
.side button:hover:not(.on){background:rgba(255,255,255,.12)}
.side .ic{width:22px;text-align:center;font-size:1.05rem}
.main{flex:1;min-width:0}
.topbar{display:none}
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,var(--c3),var(--c0));border-radius:20px;padding:14px 16px;margin-bottom:14px}
.hero img.ph{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #fff;flex:none}
.hero .ttl{flex:1 1 240px;min-width:0}
.hero h1{font-size:1.9rem;color:var(--accent);line-height:1.15}
.badge{display:inline-block;background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:2px 14px;font-size:.85rem;margin-top:4px}
.hello{background:var(--surface);border-radius:18px;padding:10px 16px;box-shadow:var(--shadow);font-size:1.15rem;font-weight:600}
.grid{display:grid;align-items:start;gap:14px;grid-template-columns:repeat(12,1fr)}
.grid>*{min-width:0}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
.panel{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.panel>h2,.panel>.ph2{margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cls{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.ctile{border:0;border-radius:16px;padding:12px 8px;text-align:center;font:inherit;color:#2d1f4e;cursor:pointer}
.ctile b{display:block;font-size:1.5rem}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}
.qa-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.qa{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;text-align:center;font:inherit;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
.qa .ic{font-size:1.5rem}
.ovs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.ov{border-radius:16px;padding:10px;text-align:center}
.ov b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}
.sch .r{display:flex;align-items:center;gap:10px;padding:5px 0}
.pchip{border-radius:10px;padding:2px 12px;font-weight:600;color:#2d1f4e;min-width:44px;text-align:center}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;color:#fff;font-size:.9rem;padding:0;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.list li:last-child{border:0}
.muted{color:var(--muted)}.small{font-size:.85rem}
.cal{width:100%;table-layout:fixed;border-collapse:collapse;text-align:center}
.cal th{font-size:.75rem;color:var(--muted);font-weight:500;padding:3px 0}
.cal td{padding:2px 0}
.cal span{display:inline-block;width:30px;height:30px;line-height:30px;border-radius:50%;font-size:.85rem}
.cal .today{background:var(--accent);color:var(--accent-fg);font-weight:700}
.cal .dot{box-shadow:inset 0 -3px 0 var(--pink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grow{flex:1 1 140px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
textarea{min-height:88px;resize:vertical}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:3px}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pink{background:var(--pink);color:#fff;border-color:var(--pink)}
.btn.del{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.85rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;margin-bottom:12px}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--c3);color:var(--fg);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border:0}
.line .nm{flex:1 1 150px;min-width:0;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:.85rem;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.seg button.on.bad{background:var(--bad);color:#fff}.seg button.on.warn{background:var(--warn);color:#fff}.seg button.on.ok{background:var(--ok);color:#fff}
.num{width:70px;text-align:center;padding:5px}
.empty{padding:26px 12px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px}
.tabs button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:.9rem}
table.t th,table.t td{text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th{color:var(--muted);font-weight:500;font-size:.8rem}
.toast{position:fixed;inset:auto 16px 20px 16px;margin-inline:auto;max-width:420px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;text-align:center;z-index:50}
.scrim{display:none}
@media (max-width:860px){
 .s8,.s7,.s6,.s5,.s4{grid-column:span 12}
 .side{position:fixed;inset-block:0;inset-inline-start:0;max-height:none;border-radius:0 20px 20px 0;z-index:40;transform:translateX(-105%);transition:transform .2s;width:240px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
 [dir=rtl] .side{border-radius:20px 0 0 20px;transform:translateX(105%)}
 .side.open{transform:none}
 .scrim.open{display:block;position:fixed;inset:0;background:rgba(20,10,40,.45);z-index:30}
 .topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
 .topbar .btn{padding:6px 12px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
<style>
.repwrap{overflow:hidden}
.rpage{width:794px;min-height:1123px;background:#f8f4ff;color:#2d1f4e;border:2px solid #cdbff0;border-radius:18px;padding:22px 24px;margin:0 auto 16px;font-family:var(--font);font-size:14px;line-height:1.45;position:relative;display:flex;flex-direction:column;gap:12px}
.rpage *{box-sizing:border-box}
.rhead{display:flex;align-items:center;gap:14px}
.rhead img{width:120px;height:auto;border-radius:10px;background:#fff}
.rhead .tt{flex:1;text-align:center}
.rhead h2{font-size:34px;color:#4b2a86;line-height:1.1}
.rhead .sd{display:inline-block;margin-top:4px;background:#d9c9fb;color:#4b2a86;border-radius:99px;padding:2px 18px;font-weight:600}
.rbox{background:#fff;border:1px solid #ddd0f5;border-radius:14px;padding:10px 14px}
.rbox h3{font-size:16px;color:#5b34a0;margin-bottom:6px}
.rrow{display:flex;gap:12px}
.rrow>*{min-width:0}
.rinfo{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;flex:1}
.rinfo b{color:#6d5f8f;font-weight:500}
.rteach{background:#fff4c9;border-radius:12px;padding:8px 16px;text-align:center;min-width:170px}
.rteach .n{font-size:26px;color:#4b2a86;font-weight:700}
.rg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rg div{border-radius:12px;padding:8px 4px;text-align:center;font-size:12.5px}
.rg b{display:block;font-size:22px}
.rg i{display:block;height:6px;border-radius:4px;background:rgba(0,0,0,.12);margin:4px 6px 0;overflow:hidden}
.rg i u{display:block;height:100%;background:#5b34a0}
.rl{margin:0;padding:0;list-style:none}
.rl li{padding:2px 0}
.rl li:before{content:"✔";color:#2fa866;margin-inline-end:8px}
.rl.im li:before{content:"➜";color:#e0568f}
.rfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:#5b34a0;font-weight:600;padding-top:6px}
.rtab{width:100%;border-collapse:collapse;font-size:13px}
.rtab th,.rtab td{padding:4px 8px;text-align:start;border-bottom:1px solid #e7defa}
.rtab th{background:#eae0fb;color:#4b2a86}
.rtab tr.tot td{background:#ffe9a8;font-weight:700}
.rkv{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-size:13px}
.rring{display:flex;gap:12px;align-items:center}
.rtext{white-space:pre-wrap}
.repbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
</style>
<style>
.locked .side,.locked .topbar,.locked .scrim{display:none}

.login{margin-top:6vh;text-align:center}

.login .f{text-align:start;margin-bottom:10px}
.login .err{color:var(--bad);min-height:1.4em;margin:6px 0}

function metrics(sid,code,w1,w2){

  return m;
}

function chartSvg(series,weeks,rl){
  const W=330,H=150,pl=34,pr=10,pt=10,pb=24;
  if(!series.length)return `<div style="color:#6d5f8f;padding:30px 0;text-align:center">${tr('nodata',rl)}</div>`;
  const vs=series.map(s=>s[1]),lo=Math.max(0,Math.floor((Math.min(...vs)-5)/10)*10),hi=100,mw=Math.max(weeks,2);
  const x=w=>pl+(w-1)/(mw-1)*(W-pl-pr),y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let g='';for(let v=lo;v<=hi;v+=(hi-lo>40?20:10))g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e7defa"/><text x="${pl-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#6d5f8f">${v}%</text>`;
  for(let w=1;w<=mw;w+=Math.ceil(mw/9))g+=`<text x="${x(w)}" y="${H-6}" font-size="10" text-anchor="middle" fill="#6d5f8f">W${w}</text>`;
  const pts=series.map(s=>x(s[0])+','+y(s[1])).join(' ');
  const area=`${x(series[0][0])},${y(lo)} ${pts} ${x(series[series.length-1][0])},${y(lo)}`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${tr('progress',rl)}">${g}<polygon points="${area}" fill="#d9c9fb" opacity=".6"/><polyline points="${pts}" fill="none" stroke="#7c3fbf" stroke-width="2.5"/>${series.map(s=>`<circle cx="${x(s[0])}" cy="${y(s[1])}" r="3.5" fill="#7c3fbf"/>`).join('')}</svg>`;
}

function impCols(){
  const H=imp.rows[0],W=Math.max(...imp.rows.map(r=>r.length)),sts=students(fc);imp.cols=[];
  for(let c=0;c<W;c++){if(c===imp.ncol)continue;
    if(!imp.rows.slice(1).some(r=>String(r[c]==null?'':r[c])!==''))continue;
    const h=H[c]==null?'':H[c],p=parseHdr(h),hs=String(h).trim();
    imp.cols.push({c,inc:hs!==''&&!/^(total|average|avg|mean|%|no\.?|#|المجموع|المتوسط)/i.test(hs),title:p.title||('Column '+(c+1)),date:p.date||'',max:p.max==null?'':p.max,wkn:p.wkn||''});
  }
  imp.map={};imp.chk={};
  imp.rows.slice(1).forEach((r,i)=>{const nm=String(r[imp.ncol]==null?'':r[imp.ncol]).trim();if(!nm||isTotalName(nm))return;const mr=matchName2(nm,sts);imp.map[i]=mr.id;imp.chk[i]=!!mr.id&&!mr.exact});

function impBuild(rows,kind){
  rows=rows.filter(r=>r.some(c=>String(c==null?'':c).trim()!==''));
  if(rows.length<2)return null;
  const sts=students(fc),W=Math.max(...rows.map(r=>r.length));let best=0,bs=-1;
  for(let c=0;c<Math.min(W,4);c++){let sc=0;rows.slice(1,41).forEach(r=>{const x=r[c];if(x!==''&&x!=null&&isNaN(+x))sc+=1+(matchName(x,sts)?3:0)});if(sc>bs){bs=sc;best=c}}
  const o={stage:'map',kind,rows,ncol:best,useOrder:true,defDate:today()};imp=o;impCols();return o;
}

async function impRun(){

    const id=it?it.id:newId();

    const r={};

    if(Object.keys(r).length){

  const cl=classes();if(!cl.length)return needCls();

  cl.forEach(c=>{if(wkG&&gradeOf(c.code)!==wkG)return;students(c.code).forEach(s=>{const m=metrics(s.id,s.cls,wkF,wkT),pin=!!D['weak_'+s.id];if(pin||(m.overall!=null&&m.overall<wkThr))rows.push({s,m,pin})})});

  const tabs=`<div class="tabs">${gs.map(g=>`<button class="${g===wkG?'on':''}" data-act="wk-g" data-v="${esc(g)}">${tr('oh_grade')} ${esc(g)}</button>`).join('')}<button class="${wkG===''?'on':''}" data-act="wk-g" data-v="">${tr('wk_allg')}</button></div>`;

});

  if(a==='add-oh'){fc=val('o-c')||fc;await add({t:'oh',cls:val('o-c'),date:val('o-d')||today(),topic:val('o-t'),r:{}});return}
  if(a==='oh-set'){await patch(d.o,{},{r:{[d.s]:d.v}});return}
  if(a==='wk'){const k='wk_'+weekKey(),cur=D[k]&&D[k].r&&D[k].r[id];await patch(k,{t:'wk',r:{}},{r:{[id]:!cur}});return}
  if(a==='sch'){const k='sch_'+today(),cur=D[k]&&D[k].r&&D[k].r[id];await patch(k,{t:'sch',r:{}},{r:{[id]:!cur}});return}
  if(a==='remadd'){const t=val('rem-in');if(!t)return;await add({t:'rem',text:t,done:false});return}
  if(a==='remt'){await patch(id,{},{done:!D[id].done});return}
  if(a==='remd'){await remove([id]);return}
  if(a==='rep-go'){rsid=id;return goto('reports')}
  if(a.indexOf('del-')===0){
    if(conf!==a+id){conf=a+id;return render()}
    conf=null;let ids=[id];
    if(a==='del-cls'){const c=D[id].code;all('cor').filter(x=>x.cls===c).forEach(x=>ids.push(x.id));all('s').filter(x=>x.cls===c).forEach(x=>ids.push(x.id,'cm_'+x.id));all('att').filter(x=>x.cls===c).forEach(x=>ids.push(x.id));all('atd').filter(x=>x.cls===c).forEach(x=>ids.push(x.id));all('oh').filter(x=>x.cls===c).forEach(x=>ids.push(x.id));all('hw').filter(x=>x.cls===c).forEach(x=>ids.push(x.id,'hwr_'+x.id));all('as').filter(x=>x.cls===c).forEach(x=>ids.push(x.id,'asr_'+x.id))}
    if(a==='del-stu')ids.push('cm_'+id);
    if(a==='del-hw')ids.push('hwr_'+id);
    if(a==='del-ass')ids.push('asr_'+id);
    openId=null;await remove(ids.filter(x=>D[x]));return;
  }
  if(a==='pdf')return makePdf();
  if(a==='pdf-save'){if(pend)await saveBlob(pend.name,pend.blob);return}
  if(a==='copy')return copyRep();
});
document.addEventListener('change',async e=>{
  const el=e.target,d=el.dataset;if(!d||!d.act)return;
  if(d.act==='fcsel'){fc=el.value;return render()}
  if(d.act==='fdate'){fdate=el.value||today();return render()}
  if(d.act==='ovsel'){ovCls=el.value;return render()}
  if(d.act==='repsel'){rsid=el.value;return render()}
  if(d.act==='replang'){cfg.rlang=el.value;await patch('cfg',{t:'cfg'},{rlang:el.value});return render()}
  if(!col)return;
  if(d.act==='cfg'){const v=d.k==='weeks'?(nz(el.value)||18):el.value;cfg[d.k]=v;await patch('cfg',{t:'cfg'},{[d.k]:v});if(d.k==='lang')render();return}
  if(d.act==='tt'){const arr=((cfg.tt&&cfg.tt[d.d])||['','','','']).slice();arr[+d.p]=el.value;cfg.tt=Object.assign({},cfg.tt,{[d.d]:arr});await patch('cfg',{t:'cfg'},{tt:{[d.d]:arr}});return}
  if(d.act==='hw-mark'){await patch('hwr_'+d.h,{t:'hwr',hid:d.h,r:{}},{r:{[d.s]:{m:el.value===''?null:nz(el.value)}}});return}
  if(d.act==='as-set'){await patch('asr_'+d.a,{t:'asr',aid:d.a,r:{}},{r:{[d.s]:el.value===''?null:nz(el.value)}});return}
  if(d.act==='cm'){await patch('cm_'+rsid,{t:'cm',sid:rsid},{[d.k]:el.value});toast(tr('saved'));render();return}
});
$('#menu').addEventListener('click',()=>{sideOpen=!sideOpen;render()});
$('#scrim').addEventListener('click',()=>{sideOpen=false;render()});
/* ---------- sign-in + cloud sync (Firebase) ---------- */
let authed=false,authChecked=false,fbFail=false,unsub=null;
function loginHtml(){return `<div class="panel login"><img src="${SCHOOL}" alt=""><h1>Miss Ayoya Teacher System<br><span style="font-size:1rem">نظام إدارة المعلمة</span></h1><div class="f"><label for="l-user">Email / البريد الإلكتروني</label><input id="l-user" type="email" autocomplete="username" autocapitalize="off"></div><div class="f"><label for="l-pass">Password / كلمة المرور</label><input id="l-pass" type="password" autocomplete="current-password"></div><div class="err" id="l-err" role="alert"></div><button class="btn pri" style="width:100%" data-act="login">Log in / دخول</button></div>`}
async function doLogin(){
  const e=val('l-user'),p=document.getElementById('l-pass').value,err=document.getElementById('l-err');
  if(!e||!p){err.textContent='Enter email and password / اكتبي البريد وكلمة المرور';return}
  err.textContent='…';
  try{await FB.signIn(e,p)}catch(x){const c=(x&&x.code)||'';err.textContent=/network/.test(c)?'No internet connection / لا يوجد اتصال':/too-many/.test(c)?'Too many attempts, try later / محاولات كثيرة، حاولي لاحقًا':'Wrong email or password / البريد أو كلمة المرور غير صحيحة'}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='login')return doLogin();
  if(a==='logout'){try{FB.signOut()}catch(x){}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='l-pass')doLogin()});
function startData(u){
  col=FB.colFor(u.uid);loaded=false;slow=false;dbOk=true;
  const timer=setTimeout(()=>{slow=true;render()},10000);
  unsub=col.onSnapshot(snap=>{
    clearTimeout(timer);slow=false;loaded=true;dbOk=true;ingest(snap.docs);
    const a=document.activeElement;
    if(a&&/^(l-user|l-pass)$/.test(a.id))return;
    if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.dataset&&a.dataset.act&&document.getElementById('view').contains(a)&&a.type!=='date')return;
    render();
  },err=>{clearTimeout(timer);dbOk=false;render()});
}
function initAuth(){
  FB.onAuth(u=>{
    authChecked=true;
    if(u){authed=true;startData(u)}
    else{authed=false;col=null;loaded=false;D={};if(unsub){unsub();unsub=null}}
    render();
  });
}
function boot(){
  render();let n=0;
  const w=setInterval(()=>{if(window.FB){clearInterval(w);initAuth()}else if(++n>120){clearInterval(w);fbFail=true;authChecked=true;render()}},100);
}
boot();
})();

</script>
